        margin-inline-start: 0 !important;
        order: -3 !important;
      }
      ha-radio-option {
        --ha-radio-option-background-color: var(--macintosh-surface);
        --ha-radio-option-border-color: var(--macintosh-black);
        --ha-radio-option-border-width: 1px;
        --ha-radio-option-checked-background-color: var(--macintosh-black);
        --ha-radio-option-checked-icon-scale: 0;
        --ha-radio-option-control-margin: 6px 10px 6px 0;
        --ha-radio-option-toggle-size: 18px;
      }
      ha-radio-option::part(control) {
        border-radius: 0 !important;
        order: -1 !important;
      }
      ha-radio-option::part(label) {
        order: 0 !important;
      }
      :host(bar-card) ha-card {
        background: transparent !important;
        border: 0 !important;
        border-radius: var(--bar-card-border-radius) !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
      bar-card-background {
        background: var(--macintosh-platinum) !important;
        border: 1px solid var(--macintosh-black) !important;
        border-radius: var(--bar-card-border-radius) !important;
        box-sizing: border-box !important;
      }
      bar-card-backgroundbar,
      bar-card-currentbar,
      bar-card-contentbar,
      bar-card-targetbar,
      bar-card-animationbar {
        border-radius: var(--bar-card-border-radius) !important;
