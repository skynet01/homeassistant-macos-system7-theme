  # System 7 grayscale ramp and 50% one-bit ordered-dither desktop.
  macintosh-black: "#000000"
  macintosh-dark-gray: "#5e5e5e"
  macintosh-mid-gray: "#8c8c8c"
  macintosh-light-gray: "#b8b8b8"
  macintosh-platinum: "#d8d8d8"
  macintosh-control: "#ececec"
  macintosh-button-radius: "6px"
  macintosh-default-button-radius: "30px"
  macintosh-default-button-shadow: "inset 0 0 0 2px var(--macintosh-surface), inset 0 0 0 3px var(--macintosh-black), 2px 2px 0 var(--macintosh-black)"
  macintosh-dialog-action-height: "40px"
  macintosh-plain-button-shadow: "2px 2px 0 var(--macintosh-black)"
  macintosh-icon-button-height: "27px"
  macintosh-icon-button-width: "31px"
  macintosh-icon-button-radius: "5px"
  macintosh-icon-button-gap: "5px"
  macintosh-progress-background: "repeating-conic-gradient(var(--macintosh-platinum) 0 25%, var(--macintosh-control) 0 50%) 0 0 / 2px 2px"
  macintosh-progress-fill: "repeating-conic-gradient(var(--macintosh-dark-gray) 0 25%, var(--macintosh-mid-gray) 0 50%) 0 0 / 2px 2px"
  macintosh-icon-dither: "repeating-conic-gradient(#000000 0 25%, transparent 0 50%)"
  macintosh-surface: "#f7f7f7"
  macintosh-global-filter: "grayscale(1)"
  macintosh-header-start-offset: "0px"
  macintosh-placeholder-color: "#5e5e5e"
  macintosh-badge-text-color: "#ffffff"
  macintosh-slider-active-color: var(--macintosh-mid-gray)
  macintosh-titlebar-background: "linear-gradient(to bottom, #ffffff 0 3px, transparent 3px 16px, #ffffff 16px 100%), repeating-linear-gradient(to bottom, #f7f7f7 0, #f7f7f7 1px, #777777 1px, #777777 2px, #f7f7f7 2px, #f7f7f7 3px)"
  macintosh-title-label-background: "#ffffff"
