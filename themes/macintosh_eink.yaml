      }
      bar-card-value {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
    "ha-button $": |
      [part~="base"] {
        border: 1px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-button-radius) !important;
        box-shadow: var(--ha-button-box-shadow) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
