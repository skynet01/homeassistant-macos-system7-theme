        border: 2px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-default-button-radius) !important;
        box-shadow: var(--macintosh-default-button-shadow) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host([size="s"]) [part~="base"] {
        border: 2px solid var(--macintosh-black) !important;
        border-radius: 25px !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host([appearance="plain"]) [part~="base"],
      :host([appearance~="plain"]) .button {
        border: 2px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-icon-button-radius) !important;
        box-shadow: var(--macintosh-plain-button-shadow) !important;
        height: var(--macintosh-icon-button-height) !important;
      }
    "ha-icon-button $":
      "ha-button $": |
        :host([appearance="plain"]) [part~="base"],
        :host([appearance~="plain"]) .button {
          border: 2px solid var(--macintosh-black) !important;
          border-radius: var(--macintosh-icon-button-radius) !important;
          box-shadow: var(--macintosh-plain-button-shadow) !important;
          height: var(--macintosh-icon-button-height) !important;
          margin-inline-end: var(--macintosh-icon-button-gap) !important;
          width: var(--macintosh-icon-button-width) !important;
        }
    "ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }
    "&hui-cover-entity-row":
      "ha-cover-controls $":
        "ha-icon-button $":
          "ha-button $": |
            :host([appearance="plain"]) [part~="base"],
