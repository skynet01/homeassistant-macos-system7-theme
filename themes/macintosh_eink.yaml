MacOS System 7 eink theme:
  card-mod-theme: MacOS System 7 eink theme
  uix-theme: MacOS System 7 eink theme

  # UIX is the primary injection layer for current HA cards, rows and dialogs.
  # Dual selectors retain support for custom cards with a divergent ha-card tree.
  uix-card-yaml: |
    ".": |
      :host ha-card,
      ha-card {
        background: var(--card-background-color) !important;
        border: var(--ha-card-border-width) solid var(--ha-card-border-color) !important;
        border-radius: var(--ha-card-border-radius) !important;
        box-shadow: var(--ha-card-box-shadow) !important;
        color: var(--primary-text-color) !important;
        font-family: var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif) !important;
      }
      :host(bar-card) ha-card,
      :host(bubble-card) ha-card {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
      }
      @media (max-width: 600px) {
        #states > div > text-divider-row {
          overflow: visible !important;
        }
      }
      :host(bar-card) ha-card {
        border-radius: var(--bar-card-border-radius) !important;
        overflow: visible !important;
      }
      bar-card-value {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host(bubble-card) {
        --bubble-border: none !important;
        --bubble-card-type-border: none !important;
        --bubble-card-type-box-shadow: none !important;
      }
      .bubble-sub-button:not(.bubble-sub-button-slider) {
        border: 1px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-button-radius) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host(bubble-card) .bubble-sub-button:not(.bubble-sub-button-slider):not(:has(
        .bubble-sub-button-icon.show-icon:not(.hidden),
        .bubble-sub-button-image:not(.hidden),
        .bubble-sub-button-name-container:not(.hidden):not(:empty),
        .bubble-dropdown-arrow:not(.hidden):not([style*="display: none"])
      )) {
        display: none !important;
      }
      :host(bubble-card) .bubble-range-slider {
        background: var(--macintosh-progress-background) !important;
      }
      :host(bubble-card) .bubble-range-fill {
        background: var(--macintosh-slider-active-color) !important;
        opacity: 1 !important;
      }
      :host(mini-graph-card) ha-card {
        padding-top: 0 !important;
      }
      :host(mini-graph-card) ha-card > .header {
        align-items: flex-start !important;
        background: var(--macintosh-titlebar-background) !important;
        border-bottom: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        color: var(--macintosh-black) !important;
        display: flex !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
        justify-content: center !important;
        line-height: 17px !important;
        margin: 0 0 12px !important;
        min-height: 21px !important;
        padding: 1px 22px 0 !important;
        position: relative !important;
      }
      :host(mini-graph-card) ha-card > .header .icon {
        position: absolute !important;
        right: 16px !important;
        top: calc(100% + 8px) !important;
        z-index: 4 !important;
      }
      :host(mini-graph-card) ha-card > .header::before,
      :host(mini-graph-card) ha-card > .header::after {
        border: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        content: "" !important;
        height: 12px !important;
        pointer-events: none !important;
        position: absolute !important;
        top: 2px !important;
        width: 12px !important;
        z-index: 2 !important;
      }
      :host(mini-graph-card) ha-card > .header::before {
        background: var(--macintosh-surface) !important;
        box-shadow: inset 1px 1px 0 var(--macintosh-light-gray) !important;
        left: 3px !important;
      }
      :host(mini-graph-card) ha-card > .header::after {
        background: var(--macintosh-titlebar-zoom-box) !important;
        right: 3px !important;
      }
      :host(mini-graph-card) ha-card > .header .name {
        background: var(--macintosh-title-label-background) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
        line-height: 17px !important;
        margin: 0 auto !important;
        padding: 0 10px !important;
        position: relative !important;
        z-index: 3 !important;
      }
      :host(mini-graph-card) ha-card > .header .name > span {
        opacity: 1 !important;
      }
      :host(mini-media-player) ha-card.--has-artwork[artwork*="cover"] {
        color: var(--mmp-text-color) !important;
      }
      :host(mini-graph-card) .state__value,
      :host(mini-graph-card) .state__uom {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host(simple-weather-card) .weather__forecast {
        border-top: 0 !important;
      }
      :host(simple-weather-card) .weather__info__title {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
      }
      :host(hui-weather-forecast-card) ha-card,
      :host(hui-gauge-card) .title,
      :host(hui-sensor-card) .header,
      :host(hui-sensor-card) .name,
      :host(hui-sensor-card) .info,
      :host(hui-sensor-card) .value,
      :host(hui-sensor-card) .measurement {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
      }
      :host([data-state="off"]) ha-state-icon,
      ha-state-icon[data-state="off"],
      ha-icon[data-state="off"] {
        -webkit-mask-image: var(--macintosh-icon-dither) !important;
        -webkit-mask-size: 2px 2px !important;
        mask-image: var(--macintosh-icon-dither) !important;
        mask-size: 2px 2px !important;
      }
      ha-radio-option {
        --ha-radio-option-background-color: var(--macintosh-surface);
        --ha-radio-option-border-color: var(--macintosh-black);
        --ha-radio-option-border-width: 1px;
        --ha-radio-option-checked-background-color: var(--macintosh-black);
        --ha-radio-option-checked-icon-scale: 0;
        --ha-radio-option-control-margin: 6px 10px 6px 0;
        --ha-radio-option-toggle-size: 18px;
      }
      ha-radio-option::part(control) {
        border-radius: 0 !important;
        order: -1 !important;
      }
      ha-radio-option::part(label) {
        order: 0 !important;
      }
      :host(bubble-card) .bubble-separator .bubble-name,
      :host(bubble-card) .separator-container .bubble-name,
      :host(mini-graph-card) ha-card > .header .name,
      :host(mini-graph-card) ha-card > .header .name > span,
      :host(simple-thermostat) .header__title {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
      }
      :host(simple-thermostat) ha-card {
        border-left: 0 !important;
      }
      :host(simple-thermostat) .current--value,
      :host(simple-thermostat) .current--unit {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host ha-card > .card-header,
      ha-card > .card-header {
        align-items: flex-start !important;
        background: var(--macintosh-titlebar-background) !important;
        border-bottom: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        color: var(--macintosh-black) !important;
        display: flex !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
        justify-content: center !important;
        line-height: 17px !important;
        margin: 0 0 12px !important;
        min-height: 21px !important;
        padding: 1px 22px 0 !important;
        position: relative !important;
      }
      :host ha-card > .card-header::before,
      :host ha-card > .card-header::after,
      ha-card > .card-header::before,
      ha-card > .card-header::after {
        border: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        content: "" !important;
        height: 12px !important;
        pointer-events: none !important;
        position: absolute !important;
        top: 2px !important;
        width: 12px !important;
        z-index: 2 !important;
      }
      :host ha-card > .card-header::before,
      ha-card > .card-header::before {
        background: var(--macintosh-surface) !important;
        box-shadow: inset 1px 1px 0 var(--macintosh-light-gray) !important;
        left: 3px !important;
      }
      :host ha-card > .card-header::after,
      ha-card > .card-header::after {
        background: var(--macintosh-titlebar-zoom-box) !important;
        right: 3px !important;
      }
      :host ha-card > .card-header > .name,
      ha-card > .card-header > .name {
        background: var(--macintosh-title-label-background) !important;
        color: var(--macintosh-black) !important;
        display: table !important;
        font-family: var(--macintosh-title-font-family) !important;
        line-height: 17px !important;
        margin: 0 auto !important;
        padding: 0 10px !important;
        position: relative !important;
        z-index: 3 !important;
      }
      button,
      .mdc-button,
      ha-button,
      mwc-button {
        border-radius: var(--macintosh-button-radius) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
      }
    "ha-button $": |
      [part~="base"] {
        border: 1px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-button-radius) !important;
        box-shadow: var(--ha-button-box-shadow) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host([appearance~="accent"]) [part~="base"] {
        background: var(--macintosh-surface) !important;
        border: 2px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-default-button-radius) !important;
        box-shadow: var(--macintosh-default-button-shadow) !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host([size="s"]) [part~="base"] {
        border: 2px solid var(--macintosh-black) !important;
        border-radius: 25px !important;
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
      }
      :host([appearance="plain"]) [part~="base"],
      :host([appearance~="plain"]) .button {
        border: 2px solid var(--macintosh-black) !important;
        border-radius: var(--macintosh-icon-button-radius) !important;
        box-shadow: var(--macintosh-plain-button-shadow) !important;
        height: var(--macintosh-icon-button-height) !important;
      }
    "state-badge $": |
      ha-state-icon[data-state="off"] {
        -webkit-mask-image: var(--macintosh-icon-dither) !important;
        -webkit-mask-size: 2px 2px !important;
        mask-image: var(--macintosh-icon-dither) !important;
        mask-size: 2px 2px !important;
      }
    "ha-gauge $": |
      .value-text {
        color: var(--macintosh-black) !important;
        fill: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
      }
    "ha-icon-button $":
      "ha-button $": |
        :host([appearance="plain"]) [part~="base"],
        :host([appearance~="plain"]) .button {
          border: 2px solid var(--macintosh-black) !important;
          border-radius: var(--macintosh-icon-button-radius) !important;
          box-shadow: var(--macintosh-plain-button-shadow) !important;
          height: var(--macintosh-icon-button-height) !important;
          margin-inline-end: var(--macintosh-icon-button-gap) !important;
          width: var(--macintosh-icon-button-width) !important;
        }
    "ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }
    "mmp-media-controls $":
      "ha-slider $": |
        #thumb {
          background: var(--macintosh-surface) !important;
          border: 1px solid var(--macintosh-black) !important;
          box-shadow: 1px 1px 0 var(--macintosh-black) !important;
        }
    "text-divider-row $": |
      .text-divider span {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
        line-height: 0 !important;
      }
    "&hui-horizontal-stack-card #root $$ ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }
    "&hui-vertical-stack-card #root $$ ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }
    "&stack-in-card": |
      ha-card > div > * {
        --card-background-color: transparent !important;
        --ha-card-border-width: 0px !important;
        --ha-card-box-shadow: none !important;
      }
    "&stack-in-card ha-card $": |
      .card-header {
        align-items: flex-start !important;
        background: var(--macintosh-direct-titlebar-background) !important;
        border-bottom: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        color: var(--macintosh-black) !important;
        display: flex !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
        justify-content: center !important;
        line-height: 17px !important;
        margin: 0 0 12px !important;
        min-height: 21px !important;
        padding: 0 22px 4px !important;
        position: relative !important;
      }
      .card-header::before,
      .card-header::after {
        border: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        content: "" !important;
        height: 12px !important;
        pointer-events: none !important;
        position: absolute !important;
        top: 2px !important;
        width: 12px !important;
        z-index: 2 !important;
      }
      .card-header::before {
        background: var(--macintosh-surface) !important;
        box-shadow: inset 1px 1px 0 var(--macintosh-light-gray) !important;
        left: 3px !important;
      }
      .card-header::after {
        background: var(--macintosh-titlebar-zoom-box) !important;
        right: 3px !important;
      }
    "&stack-in-card ha-card $$ ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }
    "&vertical-stack-in-card": |
      ha-card > div > * {
        --card-background-color: transparent !important;
        --ha-card-border-width: 0px !important;
        --ha-card-box-shadow: none !important;
      }
    "&vertical-stack-in-card ha-card $": |
      .card-header {
        align-items: flex-start !important;
        background: var(--macintosh-direct-titlebar-background) !important;
        border-bottom: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        color: var(--macintosh-black) !important;
        display: flex !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-size: var(--macintosh-title-font-size) !important;
        font-weight: 400 !important;
        justify-content: center !important;
        line-height: 17px !important;
        margin: 0 0 12px !important;
        min-height: 21px !important;
        padding: 0 22px 4px !important;
        position: relative !important;
      }
      .card-header::before,
      .card-header::after {
        border: 1px solid var(--macintosh-black) !important;
        box-sizing: border-box !important;
        content: "" !important;
        height: 12px !important;
        pointer-events: none !important;
        position: absolute !important;
        top: 2px !important;
        width: 12px !important;
        z-index: 2 !important;
      }
      .card-header::before {
        background: var(--macintosh-surface) !important;
        box-shadow: inset 1px 1px 0 var(--macintosh-light-gray) !important;
        left: 3px !important;
      }
      .card-header::after {
        background: var(--macintosh-titlebar-zoom-box) !important;
        right: 3px !important;
      }
    "&vertical-stack-in-card ha-card $$ ha-slider $": |
      #thumb {
        background: var(--macintosh-surface) !important;
        border: 1px solid var(--macintosh-black) !important;
        box-shadow: 1px 1px 0 var(--macintosh-black) !important;
      }

  uix-row-yaml: |
    ".": |
      :host {
        border-radius: 4px !important;
        color: var(--primary-text-color) !important;
        font-family: var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif) !important;
      }
      :host(text-divider-row) {
        color: var(--macintosh-black) !important;
        font-family: var(--macintosh-title-font-family) !important;
        font-weight: 400 !important;
      }
      :host(text-divider-row) .text-divider span {
        line-height: 0 !important;
      }
      :host([data-state="off"]) ha-state-icon,
      ha-state-icon[data-state="off"],
      ha-icon[data-state="off"] {
        -webkit-mask-image: var(--macintosh-icon-dither) !important;
        -webkit-mask-size: 2px 2px !important;
        mask-image: var(--macintosh-icon-dither) !important;
        mask-size: 2px 2px !important;
      }
      ha-radio,
      mwc-radio,
