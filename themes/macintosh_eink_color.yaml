  paper-font-common-base_-_font-family: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  paper-font-common-code_-_font-family: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  paper-font-body1_-_font-family: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
