# System 7 color variant. UIX and card-mod structure is shared with the
# monochrome theme; the runtime variables below supply the color palette.
MacOS System 7 color theme:
  card-mod-theme: MacOS System 7 eink theme
  uix-theme: MacOS System 7 eink theme

  # System 7 grayscale ramp and 50% one-bit ordered-dither desktop.
  macintosh-black: "#000000"
  macintosh-shadow: "#303030"
  macintosh-dark-gray: "#5e5e5e"
  macintosh-mid-gray: "#8c8c8c"
  macintosh-light-gray: "#b8b8b8"
  macintosh-platinum: "#d8d8d8"
  macintosh-control: "#ececec"
  macintosh-button-radius: "6px"
  macintosh-default-button-radius: "30px"
  macintosh-default-button-shadow: "inset 0 0 0 2px var(--macintosh-surface), inset 0 0 0 3px var(--macintosh-black), 2px 2px 0 var(--macintosh-black)"
  macintosh-dialog-action-height: "40px"
  macintosh-plain-button-shadow: "2px 2px 0 var(--macintosh-black)"
  macintosh-icon-button-height: "27px"
  macintosh-icon-button-width: "31px"
  macintosh-icon-button-radius: "5px"
  macintosh-icon-button-gap: "5px"
  macintosh-progress-background: "repeating-conic-gradient(var(--macintosh-platinum) 0 25%, var(--macintosh-control) 0 50%) 0 0 / 2px 2px"
  macintosh-progress-fill: "repeating-conic-gradient(#0000aa 0 25%, #3366cc 0 50%) 0 0 / 2px 2px"
  macintosh-icon-dither: "none"
  macintosh-surface: "#f7f7f7"
  macintosh-global-filter: "none"
  macintosh-header-start-offset: "var(--ha-sidebar-width, 0px)"
  macintosh-placeholder-color: "#5e5e5e"
  macintosh-badge-text-color: "#ffffff"
  macintosh-slider-active-color: "#0000aa"
  macintosh-titlebar-background: "linear-gradient(to bottom, #ffffff 0 3px, transparent 3px 16px, #ffffff 16px 100%), repeating-linear-gradient(to bottom, #f7f7f7 0, #f7f7f7 1px, #777777 1px, #777777 2px, #f7f7f7 2px, #f7f7f7 3px)"
  macintosh-title-label-background: "#ffffff"
  macintosh-direct-titlebar-background: "linear-gradient(var(--macintosh-title-label-background), var(--macintosh-title-label-background)) center / min(11em, calc(100% - 44px)) 17px no-repeat, var(--macintosh-titlebar-background)"
  macintosh-titlebar-zoom-box: "linear-gradient(#000000, #000000) 2px 2px / 7px 1px no-repeat, linear-gradient(#000000, #000000) 2px 2px / 1px 7px no-repeat, #f7f7f7"
  macintosh-dialog-title-font-size: "18px"
  lovelace-background: "repeating-conic-gradient(#000000 0 25%, #ffffff 0 50%) 0 0 / 4px 4px"
  accent-color: "#0000aa"
  text-accent-color: "#ffffff"

  #Header
  app-header-background-color: "#ececec"
  app-header-text-color: "#000000"
  ha-view-sections-column-gap: "20px"
  ha-view-sections-row-gap: "20px"
  ha-view-sections-narrow-column-gap: "20px"
  masonry-view-card-margin: "10px"
  stack-card-gap: "20px"
  horizontal-stack-card-gap: var(--stack-card-gap)
  vertical-stack-card-gap: var(--stack-card-gap)

  #Fonts
  macintosh-body-font-family: 'GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif'
  primary-font-family: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  macintosh-title-font-family: 'ChicagoWeb, Chicago, Charcoal, GenevaSystem, Geneva, sans-serif'
  macintosh-title-font-size: "15px"
  macintosh-section-title-font-size: "18px"
  ha-font-family-body: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  ha-font-family-heading: "var(--macintosh-title-font-family)"
  ha-font-family-code: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  ha-font-family-longform: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  mdc-typography-font-family: 'var(--macintosh-body-font-family, GenevaSystem, Geneva, Verdana, "DejaVu Sans", sans-serif)'
  mdc-typography-button-font-family: "var(--macintosh-title-font-family)"
